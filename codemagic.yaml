# Pipelines de build para la app móvil (carpeta movil/)
# Android -> .aab firmado para Google Play
# iOS     -> .ipa firmado para App Store / TestFlight
#
# Requisitos en la UI de Codemagic (una sola vez):
# - Android: subir el keystore con referencia "brecha_keystore"
#   (Teams > Code signing identities > Android keystores)
# - Android: variable GOOGLE_SERVICES_JSON (base64 del google-services.json
#   de Firebase) en el grupo "firebase"
# - iOS: usa la App Store Connect API key ya conectada en Codemagic
#   con el nombre "CodemagicAppleGansoft"

workflows:
  android-release:
    name: Android release (.aab)
    # mac_mini_m2 es la instancia incluida en el plan gratuito
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      java: 21
      node: 22
      groups:
        - firebase
      android_signing:
        - brecha_keystore
    scripts:
      - name: Instalar dependencias y sincronizar frontend
        script: |
          cd movil
          npm ci
          node sync-www.js
          npx cap sync android
      - name: Colocar google-services.json
        script: |
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > movil/android/app/google-services.json
      - name: Compilar bundle de release
        script: |
          cd movil/android
          ./gradlew bundleRelease
    artifacts:
      - movil/android/app/build/outputs/**/*.aab

  ios-release:
    name: iOS release (.ipa)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: CodemagicAppleGansoft
    environment:
      node: 22
      xcode: latest
      # Firma con identidades guardadas en Codemagic (Code signing identities):
      # certificado "brecha_dist_cert" + profile "brecha_appstore_profile"
      ios_signing:
        certificates:
          - brecha_dist_cert
        provisioning_profiles:
          - brecha_appstore_profile
    scripts:
      - name: Instalar dependencias y sincronizar frontend
        script: |
          cd movil
          npm ci
          node sync-www.js
          npx cap sync ios
      - name: Aplicar perfiles de firma
        script: |
          xcode-project use-profiles
      - name: Compilar ipa
        script: |
          xcode-project build-ipa \
            --project movil/ios/App/App.xcodeproj \
            --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
